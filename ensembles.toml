# Named reference ensembles: the blends this project reports, and the numbers a
# complete prediction set reproduces.
#
#   ./target/release/ridge --ensemble                      # does the reference hold?
#   ./target/release/ridge --ensemble -m preds_lab/lab-foo # what does my column add?
#
# The two questions share one run: the reference is the control condition of
# every measurement, so a gain can never be read off a baseline that has
# silently drifted. `--update-expected` writes the numbers below back after a
# deliberate change to the groups.

[[ensemble]]
name        = "cross"
description = "cross-split quiz blend of the old and new splits (the headline number until 2026-10-28)"
lambda      = 1000
tolerance   = 1e-5

[[ensemble.source]]
split  = "old"
groups = ["integrated", "rbm", "other", "gbmblend", "mlpblend", "fwlsblend"]
models = ["fwls1x-s1"]

[[ensemble.source]]
split  = "new"
groups = ["gold", "silver", "gbmblend2", "mlpblend2", "fwlsblend2"]

[ensemble.expected]
"old/integrated" = { quiz = 0.865765 }
"old/rbm" = { quiz = 0.871184 }
"old/other" = { quiz = 0.864390 }
"old/gbmblend" = { quiz = 0.859885 }
"old/mlpblend" = { quiz = 0.859103 }
"old/fwlsblend" = { quiz = 0.858148 }
"old/manual" = { quiz = 0.858076 }
"new/gold" = { quiz = 0.861694 }
"new/silver" = { quiz = 0.865118 }
"new/gbmblend2" = { quiz = 0.860069 }
"new/mlpblend2" = { quiz = 0.859214 }
"new/fwlsblend2" = { quiz = 0.858014 }
ensemble = { quiz = 0.856716 }

# The cross-split blend with split_3 as a third source: the 200-column base
# blend200 and its gbm / mlp / fwls blends (pipeline-3.toml, models-3.toml,
# preds_3/; with the round-3 K-fold blends, the _part3 / fwlsblend_part2 groups, since
# 2026-10-29). Same lambda as `cross` (a scan over 250-8000 had its flat minimum
# at 500-2000). The headline number since 2026-10-28.
[[ensemble]]
name        = "cross3"
default     = true
description = "cross-split quiz blend with split_3 (blend200 + its blends), the headline number"
lambda      = 1000
tolerance   = 1e-5

[[ensemble.source]]
split  = "old"
groups = ["integrated", "rbm", "other", "gbmblend", "mlpblend", "fwlsblend"]
models = ["fwls1x-s1"]

[[ensemble.source]]
split  = "new"
groups = ["gold", "silver", "gbmblend2", "mlpblend2", "fwlsblend2"]

[[ensemble.source]]
split  = "3"
groups = ["tx", "rbm", "nn", "other", "gbmblend", "mlpblend", "fwlsblend"]

[ensemble.expected]
"old/integrated" = { quiz = 0.865765 }
"old/rbm" = { quiz = 0.871184 }
"old/other" = { quiz = 0.864390 }
"old/gbmblend" = { quiz = 0.859885 }
"old/mlpblend" = { quiz = 0.859103 }
"old/fwlsblend" = { quiz = 0.858148 }
"old/manual" = { quiz = 0.858076 }
"new/gold" = { quiz = 0.861694 }
"new/silver" = { quiz = 0.865118 }
"new/gbmblend2" = { quiz = 0.860069 }
"new/mlpblend2" = { quiz = 0.859214 }
"new/fwlsblend2" = { quiz = 0.858014 }
"3/tx" = { quiz = 0.865724 }
"3/rbm" = { quiz = 0.869933 }
"3/nn" = { quiz = 0.880428 }
"3/other" = { quiz = 0.867991 }
"3/gbmblend_part1" = { quiz = 0.860689 }
"3/gbmblend_part2" = { quiz = 0.861151 }
"3/gbmblend_part3" = { quiz = 0.860546 }
"3/gbmblend_part4" = { quiz = 0.860665 }
"3/mlpblend_part1" = { quiz = 0.859370 }
"3/mlpblend_part2" = { quiz = 0.859205 }
"3/mlpblend_part3" = { quiz = 0.858875 }
"3/mlpblend_part4" = { quiz = 0.858844 }
"3/fwlsblend_part1" = { quiz = 0.858576 }
"3/fwlsblend_part2" = { quiz = 0.858294 }
ensemble = { quiz = 0.855967 }

# Single split, fitted on the probe labels: the cheap bench a new column is
# measured on. It needs only the probex predictions, so an experiment can be
# judged before it has run its fulltrain -> qual phase.
[[ensemble]]
name        = "new"
description = "new split only, fitted on probex"
lambda      = 1000
tolerance   = 1e-5

[[ensemble.source]]
split  = "new"
groups = ["gold", "silver", "gbmblend2", "mlpblend2", "fwlsblend2"]

[ensemble.expected]
gold = { probe = 0.860411, quiz = 0.861869 }
silver = { probe = 0.863964, quiz = 0.865224 }
gbmblend2 = { probe = 0.858300, quiz = 0.860105 }
mlpblend2 = { probe = 0.857486, quiz = 0.859253 }
fwlsblend2 = { probe = 0.856869, quiz = 0.858087 }
ensemble = { probe = 0.856410, quiz = 0.858156 }

# Split_3 only, fitted on the probe_3 labels: the cheap bench a new split_3 lab
# column is measured on (ridge --ensemble s3 -m preds_lab/<column>). The probe
# number is the in-sample fit; quiz needs the column's --final qual side.
[[ensemble]]
name        = "s3"
description = "split_3 only, fitted on probe_3"
lambda      = 1000
tolerance   = 1e-5

[[ensemble.source]]
split  = "3"
groups = ["tx", "rbm", "nn", "other", "gbmblend", "mlpblend", "fwlsblend"]

[ensemble.expected]
tx = { probe = 0.868180, quiz = 0.865884 }
