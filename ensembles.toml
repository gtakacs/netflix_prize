# What a delta is worth, measured by dropping columns from the blend. Printed
# next to a measured gain, because the numbers are smaller than they look.
[scale]
lines = [
    "the strongest single column in the set is worth about -7e-6",
    "the whole 25-model 'other' group is worth about -5e-6",
    "the dnn family, the largest addition so far, was worth -6.1e-5",
]
