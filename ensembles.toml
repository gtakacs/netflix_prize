gbmblend_part2 = { probe = 0.863560, quiz = 0.861153 }
gbmblend_part3 = { probe = 0.862621, quiz = 0.860547 }
gbmblend_part4 = { probe = 0.862569, quiz = 0.860665 }
mlpblend_part1 = { probe = 0.861720, quiz = 0.859401 }
mlpblend_part2 = { probe = 0.861323, quiz = 0.859225 }
mlpblend_part3 = { probe = 0.860903, quiz = 0.858877 }
mlpblend_part4 = { probe = 0.860934, quiz = 0.858847 }
