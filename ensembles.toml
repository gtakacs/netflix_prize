# Named reference ensembles: the blends this project reports, and the numbers a
# complete prediction set reproduces.
#
#   ./target/release/ridge --ensemble                      # does the reference hold?
#   ./target/release/ridge --ensemble -m preds_lab/lab-foo # what does my column add?
#
# The two questions share one run: the reference is the control condition of
# every measurement, so a gain can never be read off a baseline that has
# silently drifted. `--update-expected` writes the numbers below back after a
# deliberate change to the groups.

[[ensemble]]
name        = "cross"
description = "cross-split quiz blend of the old and new splits (the headline number until 2026-10-28)"
lambda      = 1000
tolerance   = 1e-5

[[ensemble.source]]
split  = "old"
groups = ["tx", "rbm", "nn", "other", "gbmblend", "mlpblend", "fwlsblend"]

[[ensemble.source]]
split  = "new"
groups = ["tx", "rbm", "nn", "other", "gbmblend_part1", "mlpblend_part1", "fwlsblend_part1"]

[ensemble.expected]
"old/tx" = { quiz = 0.863788 }
"old/rbm" = { quiz = 0.871184 }
"old/nn" = { quiz = 0.891057 }
"old/other" = { quiz = 0.871285 }
"old/gbmblend" = { quiz = 0.859885 }
"old/mlpblend" = { quiz = 0.859103 }
"old/fwlsblend" = { quiz = 0.858029 }
"new/tx" = { quiz = 0.865052 }
"new/rbm" = { quiz = 0.870671 }
"new/nn" = { quiz = 0.875870 }
"new/other" = { quiz = 0.877464 }
"new/gbmblend_part1" = { quiz = 0.860069 }
"new/mlpblend_part1" = { quiz = 0.859214 }
"new/fwlsblend_part1" = { quiz = 0.858014 }
"old/*" = { quiz = 0.857838 }
"new/*" = { quiz = 0.857845 }
ensemble = { quiz = 0.856716 }

# The cross-split blend with split_3 as a third source: the 200-column base
# blend200 and its gbm / mlp / fwls blends (pipeline-3.toml, models-3.toml,
# preds_3/; with the round-3 K-fold blends, the _part3 / fwlsblend_part2 groups, since
# 2026-10-29). Same lambda as `cross` (a scan over 250-8000 had its flat minimum
# at 500-2000). The headline number since 2026-10-28.
[[ensemble]]
name        = "cross3"
default     = true
description = "cross-split quiz blend with split_3 (blend200 + its blends), the headline number"
lambda      = 1000
tolerance   = 1e-5

[[ensemble.source]]
split  = "old"
groups = ["tx", "rbm", "nn", "other", "gbmblend", "mlpblend", "fwlsblend"]

[[ensemble.source]]
split  = "new"
groups = ["tx", "rbm", "nn", "other", "gbmblend", "mlpblend", "fwlsblend"]

[[ensemble.source]]
split  = "3"
groups = ["tx", "rbm", "nn", "other", "gbmblend", "mlpblend", "fwlsblend"]

[ensemble.expected]
"old/tx" = { quiz = 0.863788 }
"old/rbm" = { quiz = 0.871184 }
"old/nn" = { quiz = 0.891057 }
"old/other" = { quiz = 0.871285 }
"old/gbmblend" = { quiz = 0.859885 }
"old/mlpblend" = { quiz = 0.859103 }
"old/fwlsblend" = { quiz = 0.858029 }
"new/tx" = { quiz = 0.865052 }
"new/rbm" = { quiz = 0.870671 }
"new/nn" = { quiz = 0.875870 }
"new/other" = { quiz = 0.877464 }
"new/gbmblend" = { quiz = 0.860027 }
"new/mlpblend" = { quiz = 0.858995 }
"new/fwlsblend" = { quiz = 0.858001 }
"3/tx" = { quiz = 0.864459 }
"3/rbm" = { quiz = 0.869937 }
"3/nn" = { quiz = 0.880428 }
"3/other" = { quiz = 0.873464 }
"3/gbmblend" = { quiz = 0.860124 }
"3/mlpblend" = { quiz = 0.858371 }
"3/fwlsblend" = { quiz = 0.858083 }
"old/*" = { quiz = 0.857838 }
"new/*" = { quiz = 0.857715 }
"3/*" = { quiz = 0.857567 }
ensemble = { quiz = 0.855883 }

# Single split, fitted on the probe labels: the cheap bench a new column is
# measured on. It needs only the probex predictions, so an experiment can be
# judged before it has run its fulltrain -> qual phase.
[[ensemble]]
name        = "new"
description = "new split only, fitted on probex"
lambda      = 1000
tolerance   = 1e-5

[[ensemble.source]]
split  = "new"
groups = ["tx", "rbm", "nn", "other", "gbmblend", "mlpblend", "fwlsblend"]

[ensemble.expected]
tx = { probe = 0.863909, quiz = 0.865091 }
rbm = { probe = 0.869304, quiz = 0.870733 }
nn = { probe = 0.873266, quiz = 0.876034 }
other = { probe = 0.875514, quiz = 0.877672 }
gbmblend = { probe = 0.858145, quiz = 0.860066 }
mlpblend = { probe = 0.857265, quiz = 0.859063 }
fwlsblend = { probe = 0.856522, quiz = 0.858113 }
ensemble = { probe = 0.856167, quiz = 0.858021 }

# Split_3 only, fitted on the probe_3 labels: the cheap bench a new split_3 lab
# column is measured on (ridge --ensemble s3 -m preds_lab/<column>). The probe
# number is the in-sample fit; quiz needs the column's --final qual side.
[[ensemble]]
name        = "s3"
description = "split_3 only, fitted on probe_3"
lambda      = 1000
tolerance   = 1e-5

[[ensemble.source]]
split  = "3"
groups = ["tx", "rbm", "nn", "other", "gbmblend", "mlpblend", "fwlsblend"]

[ensemble.expected]
tx = { probe = 0.867076, quiz = 0.864655 }
rbm = { probe = 0.872366, quiz = 0.870101 }
nn = { probe = 0.882797, quiz = 0.880675 }
other = { probe = 0.875873, quiz = 0.873686 }
gbmblend = { probe = 0.862112, quiz = 0.860185 }
mlpblend = { probe = 0.860378, quiz = 0.858413 }
fwlsblend = { probe = 0.860220, quiz = 0.858103 }
ensemble = { probe = 0.859622, quiz = 0.857762 }

