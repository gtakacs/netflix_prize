# Second-level blend outputs (predictions produced by the gbm/mlp blend jobs).
# Only consumed by blenders that explicitly list these groups via `--groups`
# (e.g. fwls); the gbr*/gbc*/mlpr* jobs select the base groups instead, so they
# never blend over their own outputs.

gbmblend = [
    "gbr1-s{1..7}",
    "gbr2-s{1..3}",
    "gbr3-s1",
    "gbr4o-s{1..3}",
    "gbc1-s{1,2,3}",
    "gbc2o-s1",
]

mlpblend = [
    "mlpr2o-s{1..9}",
]

# Meta-groups: named unions of group (or other meta) names, usable only via
# -g/--groups. They are never iterated as real groups, so they don't affect the
# default (no -g) run. `all` stays a builtin (every real group); `base` selects
# the first-level predictors only (handy for ablation against the blend outputs).
[meta]
base   = ["integrated", "rbm", "other"]
blends = ["gbmblend", "mlpblend"]
