# --- Base predictors: round 4 (2026-11-02): the next size of tsvdx4 ---
# tsvdx4-20f and tsvdx4-180f are the same model generation as the sweep (proven recipe);
# their base columns are epoch snapshots (keep_epochs). tsvdx4-40 / -72 are the older
# TimeSvdConfig generation (time bins as n_bins, no frequency-binned terms: TBINS=n_bins,
# LR_IBF=0, LR_IQF=0, and SIGMA_IQF=0 so the frequency factors stay at zero instead of a
# random init), and with the sum_err quirk (SUM_ERR_BUG=1). tsvdx4-40 runs: without
# SIGMA_IQF corr 0.9987, without SUM_ERR_BUG 0.9988, with both exact (corr 1.00000).
# A learning rate the old struct has no field for is switched off (tsvdx4-72 has no
# lr_yb: LR_YB=0; with the default it had corr 0.9966).
# No .out, so they are checked by correlation only.

[jobs."s1-tsvdx4-20f"]
jobtype = "s3model"
runner = "tx"
env = "EPOCHS=14 EPSAVE=1 F=20 FULL_SU=0 LR_CU=0 LR_TA=1.5e-5 LR_TI=0.00015 LR_YD=0.0003 RAYON_NUM_THREADS=1 REG_U=0.048 REG_YD=0.04 RESET=13 SEED=200 SIGMA_U=0.0 SIGMA_Y=0.005 SIGMA_YD=0.0075 TBINS=24"
