# --- Second-level blends (gbm / mlp / fwls) over the base columns (2026-11-12) ---
# The split_3 round-3 K-fold blends on the 125 models-1.toml base columns (tx, rbm, nn, other),
# one prediction per seed ({name}-s<seed>). Job names reuse the split_3 ones, so blend_config(NAME)
# in gbm.rs / mlp.rs gives the same tuned params; --cv std --folds K: fold k trains on the other
# K-1 folds. Voting groups in voting-1.toml (vf1_core = split_3's subset1-4 as one group).
[defaults.gbmblend]
models        = "models-1.toml"
voting_models = "voting-1.toml"
inputs        = ["src/bin/gbm.rs"]
inputs_from   = ["s1-vfeat1"]
outputs       = ["{preds}/{name}.{pr}.npy", "{preds}/{name}.{fulltrain_pr}.npy", "{preds}/{name}.out"]
cmd = "cargo build --release --features lgbm --bin gbm && ./target/release/gbm {name} -p pipeline-1.toml -t {models} {model_sel} --voting-models {voting_models} --voting {voting} --seeds {seeds} {exclude} {extra}"

[defaults.mlpblend]
models        = "models-1.toml"
voting_models = "voting-1.toml"
inputs        = ["src/bin/mlp.rs"]
inputs_from   = ["s1-vfeat1"]
outputs       = ["{preds}/{name}.{pr}.npy", "{preds}/{name}.{fulltrain_pr}.npy", "{preds}/{name}.out"]
cmd = "cargo build --release --features blas --bin mlp && ./target/release/mlp {name} -p pipeline-1.toml -t {models} {model_sel} --voting-models {voting_models} --voting {voting} --seeds {seeds} {exclude} {extra}"

[defaults.fwlsblend]
models        = "models-1.toml"
voting_models = "voting-1.toml"
inputs        = ["src/bin/fwls.rs"]
inputs_from   = ["s1-vfeat1"]
outputs       = ["{preds}/{name}.{pr}.npy", "{preds}/{name}.{fulltrain_pr}.npy", "{preds}/{name}.out"]
cmd = "cargo build --release --features blas --bin fwls && ./target/release/fwls {name} -p pipeline-1.toml -t {models} {model_sel} --voting-models {voting_models} --voting {voting} --seeds {seeds} {exclude} {extra}"

# Context features from base-predictor statistics (src/bin/predfeat.rs): spread of the base
# columns overall and per family, family-mean differences (voting groups fwls57 / vfx9).
