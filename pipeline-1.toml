extra_args = ["--lambda", "3000", "--folds", "8", "--solver", "lapack"]

# Round 2 (2026-11-12): a second gbm seed (gbc2k4o = gbc2k4 params), fwlsb57k8 + the vfeat0
# features, and the split_3 stacked fwls (fwls15k4, fwls33k16) on the base + the round 1-2
# gbm / mlp blends (named with -m, so models-1.toml stays the base set). Stacked on K-fold
# blends, their probe RMSE is optimistic (blend lab 2026-10-29): judged by quiz as well.
[jobs.gbc2k4o]
jobtype = "gbmblend"
groups = ["tx", "rbm", "nn", "other"]
voting = ["vf1_core"]
seeds = [2]
extra_args = ["--cv", "std", "--folds", "4"]

[jobs.fwlsb57k8v0]
jobtype = "fwlsblend"
groups = ["tx", "rbm", "nn", "other"]
voting = ["fwls57", "vf0_all"]
seeds = [1]
inputs_from = ["s1-vfeat1", "s1-vfeat0", "s1-predfeat"]
extra_args = ["--lambda", "3000", "--folds", "8", "--solver", "lapack"]

[jobs.fwls15k4]
jobtype = "fwlsblend"
groups = ["tx", "rbm", "nn", "other"]
voting = ["fwls15"]
seeds = [1]
inputs_from = ["s1-vfeat1", "gbc2k4", "gbc2k4o", "mlpr3k4", "mlpr3vk4", "mlpr3k4v0"]
extra_args = ["--lambda", "30", "--folds", "4", "--solver", "lapack", "-m", "gbc2k4-s1", "-m", "gbc2k4o-s2", "-m", "mlpr3k4-s1", "-m", "mlpr3k4-s2", "-m", "mlpr3vk4-s1", "-m", "mlpr3k4v0-s1"]

[jobs.fwls33k16]
jobtype = "fwlsblend"
groups = ["tx", "rbm", "nn", "other"]
voting = ["fwls33"]
seeds = [2]
inputs_from = ["s1-vfeat1", "s1-predfeat", "gbc2k4", "gbc2k4o", "mlpr3k4", "mlpr3vk4", "mlpr3k4v0"]
extra_args = ["--lambda", "10000", "--folds", "16", "--solver", "lapack", "-m", "gbc2k4-s1", "-m", "gbc2k4o-s2", "-m", "mlpr3k4-s1", "-m", "mlpr3k4-s2", "-m", "mlpr3vk4-s1", "-m", "mlpr3k4v0-s1"]

# --- Latent features for the blends (2026-11-12) ---
# Small models whose user / item vectors become per-rating blend inputs (predfeat --latent-*,
# {preds}/lat/), from the training-set model only (no --final: the qual rows get the same
# model's vectors). s1-tx20lat / s1-rbm50lat are split_3's s3-tx20lat / s3-rbm50lat; s1-mf16lat
# (pu, qi) and s1-asym-16lat (su = the NSVD user vector, qi) add other factor kinds. The item
# factors of s1-mf-64u and s1-mf-64u__asym-16 (base columns, IFEAT already on disk) are read as is.

