# Pipeline definition for SPLIT_1
# Data: data/{train,probe,fulltrain,qual}/ (the old split's datasets)
# Outputs: preds_1/
#
# split_1 has the same train / probe split as the old split (pipeline-old.toml),
# and rebuilds its base predictors as proper jobs: each column of models-old.toml
# whose recipe is recorded (preds_old/<name>.cfg, .out) and runs on current code
# becomes an `s1-<name>` job of the `fit` dispatcher here, checked against the old
# column (probe curve within ~1e-4 where a .out exists, correlation > 0.999).
# preds_lab/s1tools/inventory.tsv lists every old base column with its tier and
# the proposed runner. Columns without a record (tier C) are left out.

[split]
name         = "1"
tr           = "train"
pr           = "probe"
fulltrain_tr = "fulltrain"
fulltrain_pr = "qual"
preds        = "preds_1"
sim          = "sim"

# --- Data preparation ---

[jobs.download]
inputs  = ["src/bin/download.rs"]
outputs = ["data/raw/nf_prize_dataset.tar.gz"]
cmd = "./target/release/download"

# Parse the downloaded archive straight into the four numpy datasets.
[jobs.ingest]
inputs_from = ["download"]
inputs  = ["data/qual_ratings/qual_ratings.csv.gz", "src/bin/ingest.rs"]
outputs = ["data/train/", "data/probe/", "data/fulltrain/", "data/qual/", "data/raw/README", "data/raw/movie_titles.csv", "data/raw/probe.txt", "data/raw/qualifying.txt"]
cmd = "./target/release/ingest"

# --- Defaults per job type ---

# The `fit` dispatcher (src/bin/fit.rs) on split_1: `runner` is the subcommand (tx,
# rbm, misc, chain, attn, dnn, nade). Knobs from `env`, a residual target from
# `extra_args` (--target W*base), epoch snapshots via keep_epochs (EPSAVE=1 in env).
[defaults.s3model]
inputs_from = ["ingest"]
inputs  = ["src/bin/fit.rs"]
outputs = [
    "{preds}/{name}.{pr}.npy",
    "{preds}/{name}.{fulltrain_pr}.npy",
    "{preds}/{name}.out",
]
cmd = "cargo build --release --bin fit && RAYON_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 {env} ./target/release/fit {runner} {name} -p pipeline-1.toml --final --preds {preds} {extra}"

# s3model whose train preds feed a chain or residual model (extras = ["@train_preds"]).
[defaults.s3model_base]
inputs_from = ["ingest"]
inputs  = ["src/bin/fit.rs"]
outputs = [
    "{preds}/{name}.{pr}.npy",
    "{preds}/{name}.{fulltrain_pr}.npy",
    "{preds}/{name}.{tr}.npy",
    "{preds}/{name}.{fulltrain_tr}.npy",
    "{preds}/{name}.out",
]
cmd = "cargo build --release --bin fit && RAYON_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 {env} ./target/release/fit {runner} {name} -p pipeline-1.toml --final --preds {preds} {extra}"

# s3model_base whose item factors feed a factor-similarity kNN chain (extras = ["@ifeat"]).
[defaults.s3model_ifeat]
inputs_from = ["ingest"]
inputs  = ["src/bin/fit.rs"]
outputs = [
    "{preds}/{name}.{pr}.npy",
    "{preds}/{name}.{fulltrain_pr}.npy",
    "{preds}/{name}.{tr}.npy",
    "{preds}/{name}.{fulltrain_tr}.npy",
    "{preds}/{name}.ifeat.{tr}.npy",
    "{preds}/{name}.ifeat.{fulltrain_tr}.npy",
    "{preds}/{name}.out",
]
cmd = "cargo build --release --bin fit && RAYON_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 {env} ./target/release/fit {runner} {name} -p pipeline-1.toml --final --preds {preds} {extra}"

# Item-item sim matrix for the knn-<tag> chain stage (fit nbstats): name
# <rtg>_<stat>, as in pipeline-3.toml. The old split's train set has none yet;
# they are added with the first chain that needs one.
[defaults.s3sim]
inputs_from = ["ingest"]
inputs  = ["src/bin/fit.rs"]
outputs = ["{split.sim}/{name}.{tr}.npy", "{split.sim}/{name}.{fulltrain_tr}.npy"]
cmd = "cargo build --release --bin fit && RAYON_NUM_THREADS=8 ./target/release/fit nbstats {name} -p pipeline-1.toml --preds {preds}"

# --- Base predictors: pilots (2026-11-01) ---
# One small model per runner path, each with a .out to check its probe curve
# against: the knobs are read off preds_old/<name>.cfg (preds_lab/s1tools/txmap.py
# for the TxModel family). tx runs single-threaded.

# tsvdx5 recipe (old Config struct) on TxModel in tx5 mode (no sum_err quirk); the
# NSVD1 term from train only (FULL_SU=0: full_su did not exist then). Old probe 0.88542.
[jobs."s1-tsvdx5-16"]
jobtype = "s3model"
runner = "tx"
env = "EPOCHS=20 F=16 FULL_SU=0 LR_W=0.003 NBR=50 RAYON_NUM_THREADS=1 SEED=42 TBINS=29"

# tsvdx4 sweep point (old TimeSvdConfig) on TxModel: no neighbourhood, NSVD1 from train
# only (FULL_SU=0), no cu term (LR_CU=0: the old TimeSvdConfig has no lr_cu), and without
# the sum_err quirk (SUM_ERR_BUG=0 reproduces the sweep points with lr_yb > 0; the others
# do not depend on it). With these the probe curve matches the old one exactly.
# Old probe 0.91758.
[jobs."s1-tsvdx4-swp14"]
jobtype = "s3model"
runner = "tx"
env = "EPOCHS=20 F=24 FULL_SU=0 LR_CU=0 LR_IB=0.0018 LR_IBF=2.5e-5 LR_IQF=0.0 LR_TA=0.0 LR_TI=0.0 LR_U=0.0 LR_UB=0.0062 LR_UD=0.0 LR_Y=0.00025 LR_YB=0.0 LR_YD=0.000534 RAYON_NUM_THREADS=1 REG_I=0.008322335 REG_IQF=0.01029175 REG_U2=0.28414845 REG_U=0.066059515 REG_UD=0.04827117 REG_Y=0.021581048 REG_YD=0.01371929 RESET=19 SEED=364364 SIGMA_I=0.007186402 SIGMA_IQF=0.0045767576 SIGMA_U=0.0018258156 SIGMA_Y=0.002827007 SIGMA_YD=0.012059503 TBINS=29"

# Biased SGD MF, users in order, factor reset every 10 epochs; its item factors
# feed the factor-cosine kNN chains. Old probe 0.90274.
[jobs."s1-mf-64u"]
jobtype = "s3model_ifeat"
runner = "misc"
env = "EPOCHS=20 F=64 IFEAT=1 RESET=10 SHUFFLE=0"

[jobs."s1-mf-64u__knn-25f"]
jobtype = "s3model"
runner = "chain"
env = "KN_FACT=s1-mf-64u.ifeat KN_K=25 KN_SCALE=1.5 KN_SIM=fcos KN_STAT0=none KN_TAU=0.02"
extras = ["@train_preds", "@ifeat"]

# ALS bias + MF (als8; the fit misc defaults are als8-8's).
[jobs."s1-als8-8"]
jobtype = "s3model_base"
runner = "misc"
env = "EPOCHS=10 F=8"

# The old chain used mf-64u's item factors, not als8-8's.
[jobs."s1-als8-8__knn-25f"]
jobtype = "s3model"
runner = "chain"
env = "KN_FACT=s1-mf-64u.ifeat KN_K=25 KN_SCALE=1.5 KN_SIM=fcos KN_STAT0=none KN_TAU=0.02"
extras = ["@train_preds"]
inputs_from = ["ingest", "s1-mf-64u"]
inputs = ["src/bin/fit.rs", "{preds}/s1-mf-64u.ifeat.{tr}.npy", "{preds}/s1-mf-64u.ifeat.{fulltrain_tr}.npy"]

# BellKor neighbourhood model, user-sequential SGD; old probe 0.90163.
[jobs."s1-bknbrx-50seq"]
jobtype = "s3model"
runner = "misc"
env = "EPOCHS=17 PARMODE=seq"

# Joint MF + RBM (old MfRbmConfig = today's MfRbmxConfig); old probe 0.90814.
[jobs."s1-mfrbm-48"]
jobtype = "s3model"
runner = "misc"
env = "EPOCHS=9 F=24 H=24"

