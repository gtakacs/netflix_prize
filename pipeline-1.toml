cmd = "cargo build --release --bin predfeat && ./target/release/predfeat -p pipeline-1.toml --latent-users s1-tx20lat --latent-items s1-tx20lat && ./target/release/predfeat -p pipeline-1.toml --latent-users s1-rbm50lat && ./target/release/predfeat -p pipeline-1.toml --latent-users s1-mf16lat --latent-items s1-mf16lat && ./target/release/predfeat -p pipeline-1.toml --latent-users s1-asym-16lat --latent-items s1-asym-16lat && ./target/release/predfeat -p pipeline-1.toml --latent-items s1-mf-64u && ./target/release/predfeat -p pipeline-1.toml --latent-items s1-mf-64u__asym-16"

# Blends with latent inputs next to vf1_core (mlpr3x / gbc2x params, --cv std --folds 4): A = split_3's
# mlpr3lk4 / mlpr3lak4 / gbc2lk4; B = the item factors of s1-mf-64u and its asym-16 stage (lmk4);
# C = user + item vectors of s1-mf16lat and s1-asym-16lat (luk4).

[jobs.mlpr3lk4]
jobtype = "mlpblend"
groups = ["tx", "rbm", "nn", "other"]
voting = ["vf1_core", "lattx"]
seeds = [1]
inputs_from = ["s1-vfeat1", "s1-predfeatlat"]
extra_args = ["--cv", "std", "--folds", "4"]

[jobs.mlpr3lak4]
jobtype = "mlpblend"
groups = ["tx", "rbm", "nn", "other"]
voting = ["vf1_core", "lattx", "latrbm"]
seeds = [1]
inputs_from = ["s1-vfeat1", "s1-predfeatlat"]
extra_args = ["--cv", "std", "--folds", "4"]

[jobs.gbc2lk4]
jobtype = "gbmblend"
groups = ["tx", "rbm", "nn", "other"]
voting = ["vf1_core", "lattx", "latrbm"]
seeds = [1]
inputs_from = ["s1-vfeat1", "s1-predfeatlat"]
extra_args = ["--cv", "std", "--folds", "4"]

[jobs.mlpr3lmk4]
jobtype = "mlpblend"
groups = ["tx", "rbm", "nn", "other"]
voting = ["vf1_core", "latmfi", "latasymi"]
seeds = [1]
inputs_from = ["s1-vfeat1", "s1-predfeatlat"]
extra_args = ["--cv", "std", "--folds", "4"]

[jobs.gbc2lmk4]
jobtype = "gbmblend"
groups = ["tx", "rbm", "nn", "other"]
voting = ["vf1_core", "latmfi", "latasymi"]
seeds = [1]
inputs_from = ["s1-vfeat1", "s1-predfeatlat"]
extra_args = ["--cv", "std", "--folds", "4"]

[jobs.mlpr3luk4]
