# split_3 base predictors that paid in the probe_3 ridge blend (lambda 1000),
# with the exact configuration they were trained with, so each can become a
# pipeline job later. Every entry was run as
#
#   <env> ./target/release/<bin> <name> -p pipeline-3.toml --final
#
# (preds_lab/s3run.sh wraps that and logs it to preds_lab/s3-runs.log; the
# full Debug-printed config is the first lines of preds_lab/<name>.out).
# Chains name their base in the model name: `<base>__<stage>`, target
# `W*<base>` with W = 1.0 unless given. Unlisted knobs are the binary defaults.
#
# `bin` is the `s3` dispatcher with its subcommand ("s3 tx", "s3 chain", ...; until
# 2026-10-28 these were the binaries lab-s3-tx, lab-s3-chain, ..., and the
# algorithm binaries lab-s3-integ, -nsvd, -uknn, -knnasym, -knnimp, which is how
# preds_lab/s3-runs.log names the runs before that date).
# Fields: bin, env (knobs), target (if not rtg / implied by the name),
#         probe (probe_3 RMSE), note.

# --- The 172-column blend (2026-10-22) ---
# The 152-column blend of 2026-10-21 plus the "exotic" series of 2026-10-22
# (tx ablations, NReLU RBM, NADE, transposed dnn/attention, dnn without the MF
# branch, new stages on the strong bases): forward selection on probe_3 4-fold
# CV (ridge lambda 1000) over 288 candidates, then backward elimination while
# the CV stayed within 1e-5 of its best. ridge on these 172: CV 0.866478, quiz
# 0.864134 (152 columns: CV 0.866770, quiz 0.864321). List:
# preds_lab/s3-blend172.txt. `snapshots` = epochs whose probe/qual preds
# (<name>_epNN, saved by EPSAVE=1) are blend columns too. Dropped columns sit
# in preds_lab/useless/ (useless/invalid/: chains on transposed bases whose
# qual side was built on misordered fulltrain preds).

