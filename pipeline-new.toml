# Pipeline definition for SPLIT_NEW
# Data: data/{trainx,probex,fulltrain,qual}/
# Outputs: preds_new/

[split]
name         = "new"
tr           = "trainx"
pr           = "probex"
fulltrain_tr = "fulltrain"
fulltrain_pr = "qual"
preds        = "preds_new"
sim          = "sim"

# --- Defaults per job type ---

[defaults.model]
inputs_from = ["ingest", "newsplit"]
inputs      = ["src/bin/{binary}-{split.name}.rs"]
outputs = [
    "{preds}/{name}.{pr}.npy",
    "{preds}/{name}.{fulltrain_pr}.npy",
    "{preds}/{name}.out",
]
cmd = "cargo build --release --bin {binary}-{split.name} && ./target/release/{binary}-{split.name} {name}"

[defaults.blend]
outputs = ["{preds}/{name}.{pr}.npy", "{preds}/{name}.{fulltrain_pr}.npy"]

# LightGBM cross-fit blend of base predictors + voting features. A job sets
# `seeds = [...]`; the gbm-<split> binary loads the feature matrix once and
# writes one prediction per seed ({name}-s<seed>). The LightGBM params come from
# blend_config(NAME) in the binary (per-blend dispatcher branch). Base predictors
# come from the `groups` of {models} (default: all groups) + the voting (vf*)
# glob. Built with the 'lgbm' feature (compiles LightGBM C++ on first build).
[defaults.gbmblend]
models      = "models-new.toml"
inputs      = ["src/bin/gbm-{split.name}.rs"]
inputs_from = ["vfeat1"]
outputs     = ["{preds}/{name}.{pr}.npy", "{preds}/{name}.{fulltrain_pr}.npy"]
cmd = "cargo build --release --features lgbm --bin gbm-{split.name} && ./target/release/gbm-{split.name} {name} -p pipeline-new.toml -t {models} --groups {groups} --seeds {seeds} {exclude}"

# MLP cross-fit blend of base predictors + voting features. Like gbmblend but
# with the mlp-<split> binary; one prediction per seed ({name}-s<seed>). MLP
# params come from blend_config(NAME). Built with the 'blas' feature so the dense
# products go through OpenBLAS (dgemm).
[defaults.mlpblend]
models      = "models-new.toml"
inputs      = ["src/bin/mlp-{split.name}.rs"]
inputs_from = ["vfeat1"]
outputs     = ["{preds}/{name}.{pr}.npy", "{preds}/{name}.{fulltrain_pr}.npy"]
cmd = "cargo build --release --features blas --bin mlp-{split.name} && ./target/release/mlp-{split.name} {name} -p pipeline-new.toml -t {models} --groups {groups} --seeds {seeds} {exclude}"

# FWLS (feature-weighted linear stacking) cross-fit blend: ridge on the
# interaction features (base prediction × voting feature) with a 2-fold split,
# one prediction per seed. Lambda from blend_config(NAME). Model groups from
# {models} via {groups}; context features are the vfeat1 vf* glob. The `fwls`
# binary is split-agnostic (the split comes from -p). Built with 'blas'.
[defaults.fwlsblend]
models      = "models-new.toml"
inputs      = ["src/bin/fwls.rs"]
inputs_from = ["vfeat1"]
outputs     = ["{preds}/{name}.{pr}.npy", "{preds}/{name}.{fulltrain_pr}.npy"]
cmd = "cargo build --release --features blas --bin fwls && ./target/release/fwls {name} -p pipeline-new.toml -t {models} --groups {groups} --seeds {seeds} {exclude}"

[defaults.paropt]
inputs_from = ["ingest", "newsplit"]
inputs      = ["src/bin/{binary}-{split.name}.rs"]
outputs     = ["{preds}/{name}.out"]
cmd = "cargo build --release --bin {binary}-{split.name} && ./target/release/{binary}-{split.name} {name}"

[defaults.nbstats]
inputs_from = ["ingest", "newsplit"]
inputs = ["src/bin/nbstats-{split.name}.rs"]
outputs = [
    "{sim}/{name}.{tr}.npy",
    "{sim}/{name}.{fulltrain_tr}.npy",
]
cmd = "cargo build --release --bin nbstats-{split.name} && ./target/release/nbstats-{split.name} {name}"

[defaults.vfeat]
inputs_from = ["ingest", "newsplit"]
inputs = ["src/bin/{name}-{split.name}.rs"]
# `{feature}` is expanded once per entry in the job's `features` list.
outputs = [
    "{preds}/{feature}.{pr}.npy",
    "{preds}/{feature}.{fulltrain_pr}.npy",
    "{preds}/{name}.out",
]
cmd = "cargo build --release --bin {name}-{split.name} && ./target/release/{name}-{split.name}"

# --- Data preparation ---

# Download the original Netflix Prize dataset from archive.org (no Kaggle
# account needed). Skips the fetch if data/raw/nf_prize_dataset.tar.gz exists.
[jobs.download]
inputs  = ["src/bin/download.rs"]
outputs = ["data/raw/nf_prize_dataset.tar.gz"]
cmd = "./target/release/download"

# Parse the downloaded archive straight into the four numpy datasets. Reads
# nf_prize_dataset.tar.gz directly — no intermediate files on disk.
[jobs.ingest]
inputs_from = ["download"]
inputs  = ["data/qual_ratings/qual_ratings.csv.gz", "src/bin/ingest.rs"]
outputs = ["data/train/", "data/probe/", "data/fulltrain/", "data/qual/", "data/raw/README", "data/raw/movie_titles.csv", "data/raw/probe.txt", "data/raw/qualifying.txt"]
cmd = "./target/release/ingest"

[jobs.newsplit]
inputs_from = ["ingest"]
inputs  = ["src/bin/newsplit.rs"]
outputs = ["data/{tr}/", "data/{pr}/"]
cmd = "./target/release/newsplit"

# --- Sim matrices (item-item co-occurrence / residual statistics) ---

[jobs."bin_wsupp"] # verified
jobtype = "nbstats"

[jobs."rtg_supp"]
jobtype = "nbstats"

[jobs."tsvdx4-4800lm_diff1"]
