[jobs.fwls4]
jobtype = "fwlsblend"
models_manual = ["vf/vf000_constant", "tsvdx5-400__nlpp__knn3"]
voting = ["all"]
seeds = [1]
extra_args = ["--lambda", "50"]

# FWLS over the column-mode fwls-fs selection (fwls-fs-full.log, 168 steps):
# 97 models × 72 context features = 6985 interaction columns. --in-clip 0,6
# matches the in-clip fwls-fs selected under; the default [1.00, 4.95] would
# flatten most of the picked vf/ columns to a constant.
[jobs.fwls5]
jobtype = "fwlsblend"
groups = ["fwls5"]
voting = ["fwls5"]
seeds = [1]
extra_args = ["--lambda", "100", "--in-clip", "0,6"]
