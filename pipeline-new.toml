inputs_from = ["ingest", "newsplit", "tsvdx4-4800lm"]
inputs = [
    "src/bin/nbstats-{split.name}.rs",
    "{preds}/tsvdx4-4800lm.{tr}.npy",
    "{preds}/tsvdx4-4800lm.{fulltrain_tr}.npy",
]

