# Narrow FWLS: base + blend predictors against a hand-picked 20-feature context
# set (voting group `fwls2`), plus vf090 pulled in as a model factor. An ad-hoc
# blend name, so λ comes from --lambda rather than blend_config.

[jobs.fwls2]
jobtype = "fwlsblend"
groups = ["base", "blends"]
voting = ["fwls2"]
seeds = [1]
extra_args = ["--lambda", "50", "-m", "vf/vf090_movie_rating_slope"]

[jobs.fwls3]
