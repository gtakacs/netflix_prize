# Pipeline definition for SPLIT_OLD
# Data: data/{train,probe,fulltrain,qual}/
# Outputs: preds_old/

[split]
name         = "old"
tr           = "train"
pr           = "probe"
fulltrain_tr = "fulltrain"
fulltrain_pr = "qual"
preds        = "preds_old"
sim          = "sim"

# --- Defaults per job type ---

[defaults.model]
inputs_from = ["ingest"]
outputs = [
    "{preds}/{name}.{pr}.npy",
    "{preds}/{name}.{fulltrain_pr}.npy",
    "{preds}/{name}.out",
]
cmd = "./target/release/runner --runner {runner} --name {name} --config {config} --target {target} --split {split.name}"

[defaults.sim]
inputs_from = ["ingest"]
outputs = ["sim/{name}.{tr}.npy", "sim/{name}.{fulltrain_tr}.npy"]

[defaults.blend]
outputs = ["{preds}/{name}.{pr}.npy", "{preds}/{name}.{fulltrain_pr}.npy"]

# LightGBM cross-fit blend of base predictors + voting features for the old
# split. The gbm binary is split-agnostic (the split comes from -p), so it
# serves both pipelines; models/voting come from the old-split TOMLs. No vfeat
# producer here — voting files (fwls/…, claude105/…) gate via {voting}.
[defaults.gbmblend]
models        = "models-old.toml"
voting_models = "voting-old.toml"
inputs        = ["src/bin/gbm.rs"]
outputs       = ["{preds}/{name}.{pr}.npy", "{preds}/{name}.{fulltrain_pr}.npy", "{preds}/{name}.out"]
cmd = "cargo build --release --features lgbm --bin gbm && ./target/release/gbm {name} -p pipeline-old.toml -t {models} --groups {groups} --voting-models {voting_models} --voting {voting} --seeds {seeds} {exclude}"

# MLP cross-fit blend for the old split. The mlp binary is split-agnostic (the
# split comes from -p); models/voting come from the old-split TOMLs. No vfeat
# producer here — voting files gate via {voting}. Built with the 'blas' feature.
[defaults.mlpblend]
models        = "models-old.toml"
voting_models = "voting-old.toml"
inputs        = ["src/bin/mlp.rs"]
outputs       = ["{preds}/{name}.{pr}.npy", "{preds}/{name}.{fulltrain_pr}.npy", "{preds}/{name}.out"]
cmd = "cargo build --release --features blas --bin mlp && ./target/release/mlp {name} -p pipeline-old.toml -t {models} --groups {groups} --voting-models {voting_models} --voting {voting} --seeds {seeds} {exclude}"

# FWLS (feature-weighted linear stacking) cross-fit blend for the old split. The
# fwls binary is split-agnostic (the split comes from -p); models/voting come
# from the old-split TOMLs. No vfeat producer here — voting files gate via
# {voting}. Built with the 'blas' feature.
[defaults.fwlsblend]
models        = "models-old.toml"
voting_models = "voting-old.toml"
inputs        = ["src/bin/fwls.rs"]
outputs       = ["{preds}/{name}.{pr}.npy", "{preds}/{name}.{fulltrain_pr}.npy", "{preds}/{name}.out"]
cmd = "cargo build --release --features blas --bin fwls && ./target/release/fwls {name} -p pipeline-old.toml -t {models} --groups {groups} --voting-models {voting_models} --voting {voting} --seeds {seeds} {exclude}"

# --- Data preparation ---

# Download the original Netflix Prize dataset from archive.org (no Kaggle
# account needed). Skips the fetch if data/raw/nf_prize_dataset.tar.gz exists.
[jobs.download]
inputs  = ["src/bin/download.rs"]
outputs = ["data/raw/nf_prize_dataset.tar.gz"]
cmd = "./target/release/download"

# Parse the downloaded archive straight into the four numpy datasets. Reads
# nf_prize_dataset.tar.gz directly — no intermediate files on disk.
[jobs.ingest]
inputs_from = ["download"]
inputs  = ["data/qual_ratings/qual_ratings.csv.gz", "src/bin/ingest.rs"]
outputs = ["data/train/", "data/probe/", "data/fulltrain/", "data/qual/", "data/raw/README", "data/raw/movie_titles.csv", "data/raw/probe.txt", "data/raw/qualifying.txt"]
cmd = "./target/release/ingest"

# --- Base predictors ---

# --- LightGBM blends ---

[jobs.gbr1]
jobtype = "gbmblend"
groups = ["integrated", "rbm", "other"]
voting = ["all"]
seeds = [1, 2, 3, 4, 5, 6, 7]

[jobs.gbr2]
jobtype = "gbmblend"
groups = ["integrated", "rbm", "other"]
voting = ["all"]
exclude = ["cfnade-96_ep95"]
seeds = [1, 2, 3]

[jobs.gbr3]
jobtype = "gbmblend"
groups = ["integrated", "rbm", "other"]
voting = ["all"]
seeds = [1]

[jobs.gbr4o]
jobtype = "gbmblend"
groups = ["integrated", "rbm", "other"]
voting = ["all"]
seeds = [1, 2, 3]

[jobs.gbc1]
jobtype = "gbmblend"
groups = ["integrated", "rbm", "other"]
voting = ["all"]
seeds = [1, 2, 3, 4]

[jobs.gbc2o]
jobtype = "gbmblend"
groups = ["integrated", "rbm", "other"]
voting = ["all"]
seeds = [1]

# --- MLP blends ---

[jobs.mlpr2o]
jobtype = "mlpblend"
groups = ["integrated", "rbm", "other"]
voting = ["all"]
seeds = [1, 2, 3, 4, 5, 6, 7]

# --- FWLS blends ---

[jobs.fwls1]
jobtype = "fwlsblend"
groups = ["integrated", "rbm", "other", "gbmblend", "mlpblend"]
voting = ["all"]
seeds = [1]
