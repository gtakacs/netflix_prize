[jobs.fwls2x]
jobtype = "fwlsblend"
groups = ["tx_orig", "rbm_orig", "nn_orig", "other_orig", "gbmblend_part1", "mlpblend_part1"]
voting = ["fwls2vf"]
seeds = [1]
extra_args = ["--lambda", "50", "-m", "vf/vf090_movie_rating_slope"]

# fwls2x on every gbm / mlp blend of rounds 1-2 (gbmblend_part1-2,
# mlpblend_part1-2), not only the round-1 ones.
[jobs.fwls2xa]
jobtype = "fwlsblend"
groups = ["tx_orig", "rbm_orig", "nn_orig", "other_orig", "gbmblend_part1", "gbmblend_part2", "mlpblend_part1", "mlpblend_part2"]
voting = ["fwls2vf"]
seeds = [1]
extra_args = ["--lambda", "100", "-m", "vf/vf090_movie_rating_slope"]

# --- Round 3 (2026-10-29): K-fold fwls ---
# fwls with --folds K (each fold model trains on (K-1)/K of probe, not 1/2) and a
# large lambda; the context features include the predfeat statistics. fwlsb57k8 is
# on the 200 base columns only; fwls15k4 / fwls33k16 also read the 11 gbm / mlp
# blends. Selected in the blend lab (preds_lab/s3-journal.md, 2026-10-29).
[jobs.fwlsb57k8]
jobtype = "fwlsblend"
groups = ["tx_orig", "rbm_orig", "nn_orig", "other_orig"]
voting = ["fwls57"]
seeds = [1]
inputs_from = ["vfeat1", "predfeat"]
extra_args = ["--lambda", "3000", "--folds", "8", "--solver", "lapack"]

[jobs.fwls15k4]
jobtype = "fwlsblend"
groups = ["tx_orig", "rbm_orig", "nn_orig", "other_orig", "gbmblend_part1", "gbmblend_part2", "mlpblend_part1", "mlpblend_part2"]
voting = ["fwls15"]
seeds = [1]
extra_args = ["--lambda", "30", "--folds", "4", "--solver", "lapack"]

[jobs.fwls33k16]
jobtype = "fwlsblend"
groups = ["tx_orig", "rbm_orig", "nn_orig", "other_orig", "gbmblend_part1", "gbmblend_part2", "mlpblend_part1", "mlpblend_part2"]
voting = ["fwls33"]
seeds = [2]
inputs_from = ["vfeat1", "predfeat"]
extra_args = ["--lambda", "10000", "--folds", "16", "--solver", "lapack"]

# K-fold gbm / mlp (--cv std: fold k trains on the other K-1 folds; the round 1-2
# jobs use the default --cv inv, fold k trains on 1/K). Presets are those of gbc2x
# and mlpr3x (blend_config aliases).
[jobs.gbc2k4]
jobtype = "gbmblend"
groups = ["tx_orig", "rbm_orig", "nn_orig", "other_orig"]
voting = ["subset1", "subset2", "subset3", "subset4"]
seeds = [1]
extra_args = ["--cv", "std", "--folds", "4"]

[jobs.mlpr3k4]
jobtype = "mlpblend"
groups = ["tx_orig", "rbm_orig", "nn_orig", "other_orig"]
voting = ["subset1", "subset2", "subset3", "subset4"]
seeds = [1, 2]
extra_args = ["--cv", "std", "--folds", "4"]

[jobs.mlpr3vk4]
jobtype = "mlpblend"
groups = ["tx_orig", "rbm_orig", "nn_orig", "other_orig"]
voting = ["subset1", "subset2", "subset3", "subset4", "vfx9"]
seeds = [1, 3]
inputs_from = ["vfeat1", "predfeat"]
extra_args = ["--cv", "std", "--folds", "4"]

# --- Round 4 (2026-10-30): K-fold blends with latent inputs ---
# As mlpr3k4 / gbc2k4, with the latent features of predfeatlat next to subset1-4
# (lattx: the tx20 user and item vectors, latrbm: the RBM's expected hidden units).
# Alone these blends are no better than mlpr3k4 / gbc2k4; next to them they add
# about -1e-4 to cross3 (preds_lab/s3-journal.md, 2026-10-30).
[jobs.mlpr3lk4]
jobtype = "mlpblend"
groups = ["tx_orig", "rbm_orig", "nn_orig", "other_orig"]
voting = ["subset1", "subset2", "subset3", "subset4", "lattx"]
seeds = [1]
inputs_from = ["vfeat1", "predfeatlat"]
extra_args = ["--cv", "std", "--folds", "4"]

[jobs.mlpr3lak4]
jobtype = "mlpblend"
groups = ["tx_orig", "rbm_orig", "nn_orig", "other_orig"]
voting = ["subset1", "subset2", "subset3", "subset4", "lattx", "latrbm"]
seeds = [1]
inputs_from = ["vfeat1", "predfeatlat"]
extra_args = ["--cv", "std", "--folds", "4"]

[jobs.gbc2lk4]
jobtype = "gbmblend"
groups = ["tx_orig", "rbm_orig", "nn_orig", "other_orig"]
voting = ["subset1", "subset2", "subset3", "subset4", "lattx", "latrbm"]
seeds = [1]
inputs_from = ["vfeat1", "predfeatlat"]
extra_args = ["--cv", "std", "--folds", "4"]

# --- Round 2: more seeds / variants under blend_config aliases ---
# mlpr2o = mlpr2x params, mlpc3o = mlpc3x params (separate job names so the
# round-1 jobs stay as they are); mlpr3x = the wider 128x64 net; gbr4x = the
# Bayesian-optimized regression GBR.

[jobs.mlpr2o]
jobtype = "mlpblend"
groups = ["tx_orig", "rbm_orig", "nn_orig", "other_orig"]
voting = ["subset1", "subset2", "subset3", "subset4"]
seeds = [2, 3, 4]

[jobs.mlpc3o]
jobtype = "mlpblend"
groups = ["tx_orig", "rbm_orig", "nn_orig", "other_orig"]
voting = ["subset1", "subset2", "subset3", "subset4"]
seeds = [2, 3]

[jobs.mlpr3x]
jobtype = "mlpblend"
groups = ["tx_orig", "rbm_orig", "nn_orig", "other_orig"]
voting = ["subset1", "subset2", "subset3", "subset4"]
seeds = [1]

[jobs.gbr4x]
jobtype = "gbmblend"
groups = ["tx_orig", "rbm_orig", "nn_orig", "other_orig"]
voting = ["subset1", "subset2", "subset3", "subset4"]
seeds = [1]
