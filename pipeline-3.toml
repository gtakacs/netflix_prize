# Pipeline definition for SPLIT_3
# Data: data/{train_3,probe_3,fulltrain,qual}/
# Outputs: preds_3/
#
# probe extended by +25% train ratings (from the last K=2 train days of each
# user) that keep a same-day partner in train,
# so probe_3 is closer to qual in same-day evidence (see src/bin/split_3.rs).
# Lab runs take this split with `-p pipeline-3.toml` and write to preds_lab/.
#
# Model jobs: the 172-column split_3 blend of 2026-10-22 (CV 0.866478, quiz
# 0.864134 by ridge lambda 1000 on probe_3), promoted from preds_lab/ on
# 2026-10-23, plus 3 s3-tx200dr snapshots (2026-10-24; 175 columns: CV 0.866334,
# quiz 0.863953). On 2026-10-24 14 more columns were added by forward selection
# (bk1, mfrbmx, knn-<tag> chains; 189 columns: CV 0.865719), then the base was cut
# to the first 143 of a forward selection from scratch over those 189 (CV
# 0.865737, quiz 0.863471, the same as all 189). On 2026-10-25 the base became
# the first 160 of a forward selection from scratch over all 779 lab columns with
# qual preds (CV 0.865293, quiz 0.863013; adds bk1/bknbrx/mfrbmx snapshots, knn
# grid variants and kimp/kasym chains). Later on 2026-10-25 it became the first
# 160 of a forward selection from scratch over the union of the first 180 of a
# 982-column selection, that 160 base and two chains on the ALS NSVD1 model
# s3-nsvd20-b (CV 0.865023, quiz 0.862742). On 2026-10-28 it became the first 200
# of a forward selection from scratch over that base and the 100 best of 356 new
# lab columns (new RBM hidden types, tx300r, bk1-120nb, user-kNN chains; CV
# 0.864297, quiz 0.862091). Each job runs its lab-s3-*
# binary with the knobs it was trained with (`env`) into preds_3/; models-3.toml
# lists the blend columns. Jobs not in the blend are bases of chains, roots of
# factor files, or inputs of the sim matrices.

[split]
name         = "3"
tr           = "train_3"
pr           = "probe_3"
fulltrain_tr = "fulltrain"
fulltrain_pr = "qual"
preds        = "preds_3"
sim          = "sim"

# --- Data preparation ---

[jobs.download]
inputs  = ["src/bin/download.rs"]
outputs = ["data/raw/nf_prize_dataset.tar.gz"]
cmd = "./target/release/download"

[jobs.ingest]
inputs_from = ["download"]
inputs  = ["data/qual_ratings/qual_ratings.csv.gz", "src/bin/ingest.rs"]
outputs = ["data/train/", "data/probe/", "data/fulltrain/", "data/qual/", "data/raw/README", "data/raw/movie_titles.csv", "data/raw/probe.txt", "data/raw/qualifying.txt"]
cmd = "./target/release/ingest"

[jobs.split_3]
inputs_from = ["ingest"]
inputs  = ["src/bin/split_3.rs"]
outputs = ["data/{tr}/", "data/{pr}/"]
cmd = "cargo build --release --bin split_3 && ./target/release/split_3"

# --- Defaults per job type ---

# A standalone split_3 lab binary (src/bin/{binary}.rs) run as a pipeline job:
# knobs from `env`, a residual target from `extra_args` (--target W*base), epoch
# snapshots via keep_epochs (EPSAVE=1 in env). No job uses these types since
# 2026-10-28 (the lab-s3-integ, -nsvd, -uknn, -knnasym, -knnimp model code moved
# into the library, run by `s3`); kept for new standalone experiments.
[defaults.s3lab]
inputs_from = ["ingest", "split_3"]
inputs  = ["src/bin/{binary}.rs"]
outputs = [
    "{preds}/{name}.{pr}.npy",
    "{preds}/{name}.{fulltrain_pr}.npy",
    "{preds}/{name}.out",
]
cmd = "cargo build --release --bin {binary} && RAYON_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 {env} ./target/release/{binary} {name} -p pipeline-3.toml --final --preds {preds} {extra}"

# s3lab whose train preds feed a chain or residual model (extras = ["@train_preds"]).
[defaults.s3lab_base]
inputs_from = ["ingest", "split_3"]
inputs  = ["src/bin/{binary}.rs"]
outputs = [
    "{preds}/{name}.{pr}.npy",
    "{preds}/{name}.{fulltrain_pr}.npy",
    "{preds}/{name}.{tr}.npy",
    "{preds}/{name}.{fulltrain_tr}.npy",
    "{preds}/{name}.out",
]
cmd = "cargo build --release --bin {binary} && RAYON_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 {env} ./target/release/{binary} {name} -p pipeline-3.toml --final --preds {preds} {extra}"

# s3lab_base whose item factors feed a knnf chain (extras = ["@ifeat"]).
[defaults.s3lab_ifeat]
inputs_from = ["ingest", "split_3"]
inputs  = ["src/bin/{binary}.rs"]
outputs = [
    "{preds}/{name}.{pr}.npy",
    "{preds}/{name}.{fulltrain_pr}.npy",
    "{preds}/{name}.{tr}.npy",
    "{preds}/{name}.{fulltrain_tr}.npy",
    "{preds}/{name}.ifeat.{tr}.npy",
    "{preds}/{name}.ifeat.{fulltrain_tr}.npy",
    "{preds}/{name}.out",
]
cmd = "cargo build --release --bin {binary} && RAYON_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 {env} ./target/release/{binary} {name} -p pipeline-3.toml --final --preds {preds} {extra}"

# The same three job types for the `s3` dispatcher (src/bin/s3.rs): `runner` is the
# subcommand (tx, rbm, misc, chain, attn, dnn, nade). Knobs from `env`, a residual
# target from `extra_args` (--target W*base), epoch snapshots via keep_epochs
# (EPSAVE=1 in env).
[defaults.s3model]
inputs_from = ["ingest", "split_3"]
inputs  = ["src/bin/s3.rs"]
outputs = [
    "{preds}/{name}.{pr}.npy",
    "{preds}/{name}.{fulltrain_pr}.npy",
    "{preds}/{name}.out",
]
cmd = "cargo build --release --bin s3 && RAYON_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 {env} ./target/release/s3 {runner} {name} -p pipeline-3.toml --final --preds {preds} {extra}"

# s3model whose train preds feed a chain or residual model (extras = ["@train_preds"]).
[defaults.s3model_base]
inputs_from = ["ingest", "split_3"]
inputs  = ["src/bin/s3.rs"]
outputs = [
    "{preds}/{name}.{pr}.npy",
    "{preds}/{name}.{fulltrain_pr}.npy",
    "{preds}/{name}.{tr}.npy",
    "{preds}/{name}.{fulltrain_tr}.npy",
    "{preds}/{name}.out",
]
cmd = "cargo build --release --bin s3 && RAYON_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 {env} ./target/release/s3 {runner} {name} -p pipeline-3.toml --final --preds {preds} {extra}"

# s3model_base whose item factors feed a knnf chain (extras = ["@ifeat"]).
[defaults.s3model_ifeat]
inputs_from = ["ingest", "split_3"]
inputs  = ["src/bin/s3.rs"]
outputs = [
    "{preds}/{name}.{pr}.npy",
    "{preds}/{name}.{fulltrain_pr}.npy",
    "{preds}/{name}.{tr}.npy",
    "{preds}/{name}.{fulltrain_tr}.npy",
    "{preds}/{name}.ifeat.{tr}.npy",
    "{preds}/{name}.ifeat.{fulltrain_tr}.npy",
    "{preds}/{name}.out",
]
cmd = "cargo build --release --bin s3 && RAYON_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 {env} ./target/release/s3 {runner} {name} -p pipeline-3.toml --final --preds {preds} {extra}"

# Item-item sim matrix for the knn-<tag> chain stage (s3 nbstats): name
# <rtg>_<stat>, rtg = `rtg` (ratings), `bin`, or a model whose residuals are used
# (then `inputs_from` that model and its train preds as `inputs`).
[defaults.s3sim]
inputs_from = ["ingest", "split_3"]
inputs  = ["src/bin/s3.rs"]
outputs = ["{split.sim}/{name}.{tr}.npy", "{split.sim}/{name}.{fulltrain_tr}.npy"]
cmd = "cargo build --release --bin s3 && RAYON_NUM_THREADS=8 ./target/release/s3 nbstats {name} -p pipeline-3.toml --preds {preds}"

# Pair statistics for the kimp-<tag> chain stage (s3 nbstats, stat `imp`;
# knnimp.rs): `bin_imp` the count matrix (-> bin_impcnt), `<base>_imp` the
# residual sums of a model (-> <base>_impsum; `inputs_from` that model and its
# train preds as `inputs`). Outputs are given per job, as the file stem differs
# from the job name.
[defaults.s3imp]
inputs_from = ["ingest", "split_3"]
inputs  = ["src/bin/s3.rs"]
cmd = "cargo build --release --bin s3 && RAYON_NUM_THREADS=8 ./target/release/s3 nbstats {name} -p pipeline-3.toml --preds {preds}"

[defaults.vfeat]
inputs_from = ["ingest", "split_3"]
inputs = ["src/bin/s3.rs"]
voting_models = "voting-3.toml"
outputs = [
    "{preds}/{feature}.{pr}.npy",
    "{preds}/{feature}.{fulltrain_pr}.npy",
    "{preds}/{name}.out",
]
cmd = "cargo build --release --bin s3 && RAYON_NUM_THREADS=4 ./target/release/s3 vfeat1 {name} -p pipeline-3.toml --preds {preds}"

# --- Second-level blends (gbm / mlp / fwls) over the base columns ---
# As in pipeline-new.toml: cross-fit blends of the base columns (+ voting
# features), one prediction per seed ({name}-s<seed>). Job names reuse the
# new-split blends (gbr2x, gbc2x, mlpr2x, mlpc3x, fwls2x) so blend_config(NAME)
# gives their tuned params.
[defaults.gbmblend]
models        = "models-3.toml"
voting_models = "voting-3.toml"
inputs        = ["src/bin/gbm.rs"]
inputs_from   = ["vfeat1"]
outputs       = ["{preds}/{name}.{pr}.npy", "{preds}/{name}.{fulltrain_pr}.npy", "{preds}/{name}.out"]
cmd = "cargo build --release --features lgbm --bin gbm && ./target/release/gbm {name} -p pipeline-3.toml -t {models} {model_sel} --voting-models {voting_models} --voting {voting} --seeds {seeds} {exclude} {extra}"

[defaults.mlpblend]
models        = "models-3.toml"
voting_models = "voting-3.toml"
inputs        = ["src/bin/mlp.rs"]
inputs_from   = ["vfeat1"]
outputs       = ["{preds}/{name}.{pr}.npy", "{preds}/{name}.{fulltrain_pr}.npy", "{preds}/{name}.out"]
cmd = "cargo build --release --features blas --bin mlp && ./target/release/mlp {name} -p pipeline-3.toml -t {models} {model_sel} --voting-models {voting_models} --voting {voting} --seeds {seeds} {exclude} {extra}"

[defaults.fwlsblend]
models        = "models-3.toml"
voting_models = "voting-3.toml"
inputs        = ["src/bin/fwls.rs"]
inputs_from   = ["vfeat1"]
outputs       = ["{preds}/{name}.{pr}.npy", "{preds}/{name}.{fulltrain_pr}.npy", "{preds}/{name}.out"]
cmd = "cargo build --release --features blas --bin fwls && ./target/release/fwls {name} -p pipeline-3.toml -t {models} {model_sel} --voting-models {voting_models} --voting {voting} --seeds {seeds} {exclude} {extra}"

# --- Voting features ---

[jobs.vfeat1]
jobtype = "vfeat"
voting = ["all"]

# Context features from base-predictor statistics (src/bin/predfeat.rs): spread of
# the blend200 columns overall and per family, family-mean differences; used by
# the round-3 fwls blends (voting groups fwls33 / fwls57).
[jobs.predfeat]
inputs_from = ["ingest", "split_3"]
inputs = ["src/bin/predfeat.rs"]
outputs = ["{preds}/vfx/std_all.{pr}.npy", "{preds}/vfx/std_all.{fulltrain_pr}.npy", "{preds}/vfx/range_all.{pr}.npy", "{preds}/vfx/range_all.{fulltrain_pr}.npy", "{preds}/vfx/mean_c.{pr}.npy", "{preds}/vfx/mean_c.{fulltrain_pr}.npy", "{preds}/vfx/std_tx.{pr}.npy", "{preds}/vfx/std_tx.{fulltrain_pr}.npy", "{preds}/vfx/std_rbm.{pr}.npy", "{preds}/vfx/std_rbm.{fulltrain_pr}.npy", "{preds}/vfx/std_nn.{pr}.npy", "{preds}/vfx/std_nn.{fulltrain_pr}.npy", "{preds}/vfx/std_other.{pr}.npy", "{preds}/vfx/std_other.{fulltrain_pr}.npy", "{preds}/vfx/d_tx_rbm.{pr}.npy", "{preds}/vfx/d_tx_rbm.{fulltrain_pr}.npy", "{preds}/vfx/d_tx_nn.{pr}.npy", "{preds}/vfx/d_tx_nn.{fulltrain_pr}.npy", "{preds}/vfx/d_tx_other.{pr}.npy", "{preds}/vfx/d_tx_other.{fulltrain_pr}.npy"]
cmd = "cargo build --release --bin predfeat && ./target/release/predfeat -p pipeline-3.toml -t models-3.toml --groups tx=tx_orig,rbm=rbm_orig,nn=nn_orig,other=other_orig"

# Latent features for the blends (2026-10-30): the user and item vectors of a small
# tx and the expected hidden units of an RBM, both from the training-set model only
# (only its train_3 artifacts are read; the qual rows get the same model's vectors).
# predfeat --latent-users / --latent-items turns them into per-rating columns in
# {preds}/lat/ (voting groups lattx, latrbm). The models' own columns are not in
# the base, so only the artifacts are declared.
[jobs."s3-tx20lat"]
jobtype = "s3model_base"
runner = "tx"
env = "EPOCHS=20 F=20 IFEAT=1 LR_W=0.002 NBR=25 UFEAT=1 WF=0.8"
outputs = ["{preds}/{name}.{pr}.npy", "{preds}/{name}.out", "{preds}/{name}.ufeat.{tr}.npy", "{preds}/{name}.ifeat.{tr}.npy"]

[jobs."s3-rbm50lat"]
jobtype = "s3model_base"
runner = "rbm"
env = "EPOCHS=20 H=50 UFEAT=1"
outputs = ["{preds}/{name}.{pr}.npy", "{preds}/{name}.out", "{preds}/{name}.ufeat.{tr}.npy"]

[jobs.predfeatlat]
inputs_from = ["ingest", "split_3", "s3-tx20lat", "s3-rbm50lat"]
inputs = ["src/bin/predfeat.rs"]
outputs = ["{preds}/lat/s3-tx20lat.u00.{pr}.npy", "{preds}/lat/s3-tx20lat.u00.{fulltrain_pr}.npy", "{preds}/lat/s3-tx20lat.u01.{pr}.npy", "{preds}/lat/s3-tx20lat.u01.{fulltrain_pr}.npy", "{preds}/lat/s3-tx20lat.u02.{pr}.npy", "{preds}/lat/s3-tx20lat.u02.{fulltrain_pr}.npy", "{preds}/lat/s3-tx20lat.u03.{pr}.npy", "{preds}/lat/s3-tx20lat.u03.{fulltrain_pr}.npy", "{preds}/lat/s3-tx20lat.u04.{pr}.npy", "{preds}/lat/s3-tx20lat.u04.{fulltrain_pr}.npy", "{preds}/lat/s3-tx20lat.u05.{pr}.npy", "{preds}/lat/s3-tx20lat.u05.{fulltrain_pr}.npy", "{preds}/lat/s3-tx20lat.u06.{pr}.npy", "{preds}/lat/s3-tx20lat.u06.{fulltrain_pr}.npy", "{preds}/lat/s3-tx20lat.u07.{pr}.npy", "{preds}/lat/s3-tx20lat.u07.{fulltrain_pr}.npy", "{preds}/lat/s3-tx20lat.u08.{pr}.npy", "{preds}/lat/s3-tx20lat.u08.{fulltrain_pr}.npy", "{preds}/lat/s3-tx20lat.u09.{pr}.npy", "{preds}/lat/s3-tx20lat.u09.{fulltrain_pr}.npy", "{preds}/lat/s3-tx20lat.u10.{pr}.npy", "{preds}/lat/s3-tx20lat.u10.{fulltrain_pr}.npy", "{preds}/lat/s3-tx20lat.u11.{pr}.npy", "{preds}/lat/s3-tx20lat.u11.{fulltrain_pr}.npy", "{preds}/lat/s3-tx20lat.u12.{pr}.npy", "{preds}/lat/s3-tx20lat.u12.{fulltrain_pr}.npy", "{preds}/lat/s3-tx20lat.u13.{pr}.npy", "{preds}/lat/s3-tx20lat.u13.{fulltrain_pr}.npy", "{preds}/lat/s3-tx20lat.u14.{pr}.npy", "{preds}/lat/s3-tx20lat.u14.{fulltrain_pr}.npy", "{preds}/lat/s3-tx20lat.u15.{pr}.npy", "{preds}/lat/s3-tx20lat.u15.{fulltrain_pr}.npy", "{preds}/lat/s3-tx20lat.u16.{pr}.npy", "{preds}/lat/s3-tx20lat.u16.{fulltrain_pr}.npy", "{preds}/lat/s3-tx20lat.u17.{pr}.npy", "{preds}/lat/s3-tx20lat.u17.{fulltrain_pr}.npy", "{preds}/lat/s3-tx20lat.u18.{pr}.npy", "{preds}/lat/s3-tx20lat.u18.{fulltrain_pr}.npy", "{preds}/lat/s3-tx20lat.u19.{pr}.npy", "{preds}/lat/s3-tx20lat.u19.{fulltrain_pr}.npy", "{preds}/lat/s3-tx20lat.i00.{pr}.npy", "{preds}/lat/s3-tx20lat.i00.{fulltrain_pr}.npy", "{preds}/lat/s3-tx20lat.i01.{pr}.npy", "{preds}/lat/s3-tx20lat.i01.{fulltrain_pr}.npy", "{preds}/lat/s3-tx20lat.i02.{pr}.npy", "{preds}/lat/s