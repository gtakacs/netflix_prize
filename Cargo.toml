[package]
edition = "2024"
name = "netflix_prize"
version = "1.0.0"

[dependencies]
blas = {version="0.22", optional=true}
byteorder = "1.5.0"
flate2 = "1.0"
indexmap = {version="2", features=["serde"]}
indicatif = {version="0.18.3", features=["rayon"]}
libm = {version="0.2", optional=true}
lightgbm3 = {version="1.0", optional=true}
md5 = "0.7"
minreq = {version="2", default-features=false, features=["https-rustls"]}
nalgebra = "0.34.1"
ndarray = "0.16.1"
ndarray-npy = "0.9.1"
parking_lot = "0.12.5"
rand = "0.9.2"
rand_distr = "0.5.1"
rayon = "1.11.0"
serde = {version="1", features=["derive"]}
serde_json = {version="1", optional=true}
tar = "0.4"
toml = {version="0.8", features=["preserve_order"]}

[features]
lgbm = ["dep:lightgbm3", "dep:serde_json"]
blas = ["dep:blas", "dep:blas-src", "ndarray/blas"]
# Deterministic transcendentals (libm crate instead of system libm) for
# cross-platform bit-reproducibility. See src/cfnade.rs `fmath`.
det-math = ["dep:libm"]

[[bin]]
name = "ridge"
required-features = ["blas"]

[[bin]]
name = "fwls"
required-features = ["blas"]

[[bin]]
name = "fwls-fs"
required-features = ["blas"]

[target.'cfg(target_os = "macos")'.dependencies]
blas-src = { version = "0.10", features = ["accelerate"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
blas-src = { version = "0.10", features = ["openblas"], optional = true }

[dev-dependencies]
ctor = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
